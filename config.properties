# ChatMonitor 配置文件（修改后约 30 秒内自动热加载，无需重启）
# 目标进程名（用于检测是否运行；激活用 .app 路径，支持中文应用如"微信"）
processName=Telegram

# 目标列表：群聊或联系人，多个用英文逗号分隔（OCR 模糊匹配，左侧列表区域）
# 每轮按顺序轮流切换下一个目标（round-robin），点击进入后滚动
targets=

# 进入会话后，在右侧消息区找该人的消息点击（取可见范围内最下方一条）
# 留空则进入会话后直接滚动
personKeyword=

# 真人（鼠标或键盘）闲置该秒数后才接管，并以此节奏切换下一个目标
idleSeconds=600

# 目标切换告警：距上次切换目标超过该秒数仍未切换（用户持续操作），发出系统通知告警；0 表示关闭
switchAlertSeconds=600

# 拟人滚动时长范围（秒），每轮从中随机取一个值
scrollMinSeconds=5
scrollMaxSeconds=5

# 回底滚动格数（进入聊天后与每轮结束前向下滚的格数，保证停在最新消息、清除未读红点）
# 聊天记录很长、历史位置很深时可加大，如 240
scrollBackTicks=160

# 连续任务失败达到 maxRetries 次后，随机退避 backoffMinSeconds~backoffMaxSeconds 秒
maxRetries=3
backoffMinSeconds=60
backoffMaxSeconds=300

# ocr_helper 二进制路径（相对项目根目录或绝对路径）
helperPath=bin/ocr_helper
